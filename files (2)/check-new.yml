name: 新着大会チェック

on:
  schedule:
    - cron: '5 * * * *'  # 毎時5分（UTC）に実行
  workflow_dispatch:  # 手動実行もできるように

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存パッケージのインストール
        run: npm install

      - name: 新着大会チェックを実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node run-check.js

      - name: data.jsonの変更をコミット
        run: |
          git config user.name "dmps-tournament-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update data.json [skip ci]"
          git push
